
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101321">
<title>لوحة النقاط</title>

<style>
:root {
  --bg: #101321;
  --card: #1a2033;
  --line: #303950;
  --purple: #8b5cf6;
  --muted: #aab0c0;
  --green: #167d57;
  --red: #a83255;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  color: #fff;
  font-family: Arial, sans-serif;
}

main {
  max-width: 720px;
  margin: auto;
}

header {
  text-align: center;
  padding: 22px 8px;
}

header h1 {
  color: #c4b5fd;
  margin: 0 0 8px;
}

header p,
.muted {
  color: var(--muted);
}

.status {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  margin: 14px 0;
}

h2 {
  font-size: 20px;
  color: #c4b5fd;
  margin: 0 0 16px;
}

h3 {
  margin: 0 0 10px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 7px 0 12px;
  background: #101626;
  color: white;
  border: 1px solid #3b4660;
  border-radius: 9px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 11px 14px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  background: #46516b;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.primary {
  background: #7c3aed;
  width: 100%;
}

.green {
  background: var(--green);
}

.red {
  background: var(--red);
}

.soft {
  background: #303950;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
}

.hidden {
  display: none !important;
}

.player {
  background: #242d43;
  border: 1px solid #35415b;
  border-radius: 12px;
  padding: 13px;
  margin: 9px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.score {
  color: #fbbf24;
  font-size: 20px;
  font-weight: bold;
}

.controls {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.controls button {
  padding: 8px 10px;
}

.top {
  border-color: #b48cff;
}

.small {
  font-size: 13px;
  color: var(--muted);
}

.msg {
  margin: 10px 0;
  color: #fca5a5;
  font-size: 13px;
}

.ok {
  color: #86efac;
}

footer {
  text-align: center;
  color: #70788d;
  font-size: 12px;
  padding: 20px;
}

@media(max-width:450px) {
  body {
    padding: 10px;
  }

  .card {
    padding: 14px;
  }

  .player {
    align-items: flex-start;
  }

  .controls {
    width: 100%;
  }

  .controls button {
    flex: 1;
  }
}
</style>
</head>

<body>

<main>

<header>
  <h1>🏆 لوحة النقاط</h1>
  <p>تابع ترتيب اللاعبين واجمع أكبر عدد من النقاط</p>
</header>

<div class="status" id="status">
  جاري الاتصال بقاعدة البيانات...
</div>

<!-- ترتيب اللاعبين -->
<section class="card">
  <h2>🥇 ترتيب اللاعبين</h2>

  <div id="playersList">
    <p class="muted">جاري التحميل...</p>
  </div>
</section>

<!-- تسجيل دخول الأدمن -->
<section class="card" id="adminLogin">
  <h2>🔐 دخول الأدمن</h2>

  <input
    id="adminPassword"
    type="password"
    placeholder="كلمة مرور الأدمن"
    autocomplete="current-password"
  >

  <button class="primary" id="adminLoginBtn">
    تسجيل الدخول
  </button>

  <p id="loginMessage" class="msg"></p>
</section>

<!-- لوحة الأدمن -->
<section class="card hidden" id="adminPanel">

  <div class="row">
    <h2>⚙️ لوحة الأدمن</h2>

    <button class="soft" id="adminLogoutBtn">
      تسجيل الخروج
    </button>
  </div>

  <hr>

  <h3>إضافة لاعب جديد</h3>

  <input
    id="newPlayerName"
    maxlength="40"
    placeholder="اسم اللاعب"
  >

  <input
    id="newPlayerPoints"
    type="number"
    step="1"
    value="0"
    placeholder="النقاط الابتدائية"
  >

  <button class="primary" id="addPlayerBtn">
    إضافة اللاعب
  </button>

  <p class="small">
    يمكنك زيادة أو خصم النقاط وحذف اللاعبين من قائمة الترتيب.
  </p>

  <p id="adminMessage" class="msg"></p>

</section>

<footer>
  نظام النقاط © 2026
</footer>

</main>

<script type="module">

// Firebase imports
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  update,
  remove,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// إعدادات Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCPTUhg1OT2QzosTJb9_YIJjRl3dDQ0UCg",
  authDomain: "points-50629.firebaseapp.com",
  databaseURL: "https://points-50629-default-rtdb.firebaseio.com",
  projectId: "points-50629",
  storageBucket: "points-50629.firebasestorage.app",
  messagingSenderId: "147880779035",
  appId: "1:147880779035:web:fe53ee48b0fb40a01f87be",
  measurementId: "G-TC3LNVD21E"
};


// بيانات الأدمن
const ADMIN_UID = "C1vYjnJ0DMQ7ujmsTtUD1aaV9HR2";
const ADMIN_EMAIL = "admin@points-system.com";


// تشغيل Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

let players = {};
let isAdmin = false;


// رسائل الموقع
function showMessage(id, text, success = false) {
  $(id).textContent = text;
  $(id).className = success ? "msg ok" : "msg";
}


// حالة الاتصال
function setStatus(text, error = false) {
  $("status").textContent = text;
  $("status").style.color = error ? "#fca5a5" : "#86efac";
}


// إنشاء زر
function makeButton(text, className, action) {
  const button = document.createElement("button");

  button.type = "button";
  button.textContent = text;
  button.className = className;

  button.addEventListener("click", action);

  return button;
}


// عرض اللاعبين
function renderPlayers() {

  const box = $("playersList");
  box.replaceChildren();

  const list = Object.entries(players).sort((a, b) => {

    const pointsDifference =
      Number(b[1].points || 0) -
      Number(a[1].points || 0);

    return pointsDifference ||
      String(a[1].name || "").localeCompare(
        String(b[1].name || ""),
        "ar"
      );

  });


  if (list.length === 0) {

    const empty = document.createElement("p");

    empty.className = "muted";
    empty.textContent = "لا يوجد لاعبون حتى الآن.";

    box.append(empty);

    return;
  }


  list.forEach(([id, player], index) => {

    const item = document.createElement("div");

    item.className =
      "player" + (index === 0 ? " top" : "");


    const info = document.createElement("div");

    const name = document.createElement("strong");

    name.textContent =
      `${index + 1}. ${player.name || "لاعب بدون اسم"}`;


    const rank = document.createElement("div");

    rank.className = "small";

    rank.textContent =
      index === 0
        ? "المتصدر 🏆"
        : `المركز ${index + 1}`;


    info.append(name, rank);


    const score = document.createElement("div");

    score.className = "score";

    score.textContent =
      `${Number(player.points || 0)} نقطة`;


    item.append(info, score);


    // أزرار التحكم تظهر للأدمن فقط
    if (isAdmin) {

      const controls = document.createElement("div");

      controls.className = "controls";

      controls.append(

        makeButton("+1", "green", () =>
          changePoints(id, 1)
        ),

        makeButton("+5", "green", () =>
          changePoints(id, 5)
        ),

        makeButton("+10", "green", () =>
          changePoints(id, 10)
        ),

        makeButton("-1", "red", () =>
          changePoints(id, -1)
        ),

        makeButton("-5", "red", () =>
          changePoints(id, -5)
        ),

        makeButton("حذف", "soft", () =>
          deletePlayer(id)
        )

      );

      item.append(controls);

    }


    box.append(item);

  });

}


// متابعة بيانات اللاعبين
onValue(
  ref(db, "players"),

  snapshot => {

    players = snapshot.val() || {};

    renderPlayers();

    setStatus("🟢 متصل - الترتيب يتحدث تلقائيًا");

  },

  error => {

    setStatus(
      "تعذر الاتصال: " + error.message,
      true
    );

  }
);


// تسجيل دخول الأدمن
$("adminLoginBtn").addEventListener("click", async () => {

  const password = $("adminPassword").value;

  if (!password) {

    showMessage(
      "loginMessage",
      "اكتب كلمة المرور أولاً."
    );

    return;
  }


  $("adminLoginBtn").disabled = true;

  showMessage(
    "loginMessage",
    "جاري تسجيل الدخول..."
  );


  try {

    await signInWithEmailAndPassword(
      auth,
      ADMIN_EMAIL,
      password
    );

    showMessage(
      "loginMessage",
      "تم تسجيل الدخول بنجاح.",
      true
    );

  } catch (error) {

    showMessage(
      "loginMessage",
      "فشل تسجيل الدخول. راجع كلمة المرور."
    );

  } finally {

    $("adminPassword").value = "";
    $("adminLoginBtn").disabled = false;

  }

});


// تسجيل الدخول بزر Enter
$("adminPassword").addEventListener("keydown", event => {

  if (event.key === "Enter") {
    $("adminLoginBtn").click();
  }

});


// متابعة حالة الأدمن
onAuthStateChanged(auth, async user => {

  isAdmin =
    !!user &&
    user.uid === ADMIN_UID;


  $("adminLogin").classList.toggle(
    "hidden",
    isAdmin
  );

  $("adminPanel").classList.toggle(
    "hidden",
    !isAdmin
  );


  renderPlayers();


  // منع أي حساب غير حساب الأدمن المحدد
  if (user && !isAdmin) {
    await signOut(auth);
  }

});


// تسجيل الخروج
$("adminLogoutBtn").addEventListener("click", async () => {

  try {
    await signOut(auth);
  } catch (error) {
    alert("تعذر تسجيل الخروج: " + error.message);
  }

});


// إضافة لاعب
$("addPlayerBtn").addEventListener("click", async () => {

  if (!isAdmin) return;


  const name = $("newPlayerName").value.trim();

  const pointsText = $("newPlayerPoints").value.trim();

  const points = Number(pointsText);


  if (
    !name ||
    pointsText === "" ||
    !Number.isSafeInteger(points)
  ) {

    showMessage(
      "adminMessage",
      "اكتب اسم اللاعب وعدد نقاط صحيح."
    );

    return;
  }


  // منع تكرار الأسماء
  const nameExists = Object.values(players).some(player =>
    String(player.name || "").trim().toLowerCase() ===
    name.toLowerCase()
  );


  if (nameExists) {

    showMessage(
      "adminMessage",
      "هذا الاسم موجود بالفعل."
    );

    return;
  }


  $("addPlayerBtn").disabled = true;


  try {

    const newPlayerRef = push(ref(db, "players"));

    await set(newPlayerRef, {
      name: name,
      points: points
    });


    $("newPlayerName").value = "";
    $("newPlayerPoints").value = "0";


    showMessage(
      "adminMessage",
      "تمت إضافة اللاعب بنجاح.",
      true
    );

  } catch (error) {

    showMessage(
      "adminMessage",
      "تعذر إضافة اللاعب: " + error.message
    );

  } finally {

    $("addPlayerBtn").disabled = false;

  }

});


// تعديل النقاط
async function changePoints(id, amount) {

  if (!isAdmin || !players[id]) return;


  const currentPoints =
    Number(players[id].points || 0);

  const newPoints = currentPoints + amount;


  if (!Number.isSafeInteger(newPoints)) {

    alert("قيمة النقاط غير صحيحة.");

    return;
  }


  try {

    await update(
      ref(db, "players/" + id),
      {
        points: newPoints
      }
    );

  } catch (error) {

    alert("تعذر تعديل النقاط: " + error.message);

  }

}


// حذف لاعب
async function deletePlayer(id) {

  if (!isAdmin || !players[id]) return;


  const confirmed = confirm(
    `هل تريد حذف اللاعب ${players[id].name}؟`
  );

  if (!confirmed) return;


  try {

    await remove(
      ref(db, "players/" + id)
    );

  } catch (error) {

    alert("تعذر حذف اللاعب: " + error.message);

  }

}

</script>

</body>
</html>
